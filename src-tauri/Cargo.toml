[package]
name = "ffyon-tracker"
version = "0.6.0"
description = "Income and expense tracker for Tanned by Ffy"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ffyon_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup", "hooks"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring-core = "1"
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Reaches the new entry box from any other app, without going to the window first.
tauri-plugin-global-shortcut = "2"
# How the tray says what it just did while the window is out of sight.
tauri-plugin-notification = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
